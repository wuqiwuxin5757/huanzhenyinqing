<style>
  :root { --bg: #f6f5f2; --text: #1d1c1a; --muted: #6b6862; --accent: #c2572f; --track: #e9e4dd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161514; --text: #ecebe8; --muted: #a29f99; --accent: #e0774c; --track: #2a2724; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: grid; place-items: center;
    font: 15px/1.6 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  .box { text-align: center; max-width: 440px; padding: 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .spin { width: 46px; height: 46px; margin: 26px auto; border-radius: 50%; border: 4px solid var(--track);
    border-top-color: var(--accent); animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { color: var(--muted); margin: 6px 0; }
  .err { color: #c0392b; display: none; white-space: pre-wrap; }
</style>
